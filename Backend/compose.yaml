# Local PostgreSQL for the backend. Start it with: docker compose up -d
# Development only: the password below is not a secret.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: finovex-postgres
    environment:
      POSTGRES_DB: finovex
      POSTGRES_USER: finovex
      POSTGRES_PASSWORD: finovex
    ports:
      # Host port 5433, because 5432 is often taken by a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major version>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finovex -d finovex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
