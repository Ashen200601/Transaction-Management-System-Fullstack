# Local development: the PostgreSQL from compose.yaml and the Vite dev server.
# Nothing in this file is a real secret, and none of it may be used outside a developer machine.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finovex
    username: tmsadmin
    password: tmsadmin

finovex:
  security:
    jwt:
      # Development-only signing key. Production sets FINOVEX_SECURITY_JWT_SECRET instead.
      secret: BKSDEz+W5Tun9s8DEk0r6kqL/1wiH/PNTdpG4zLQZqHMH+RZulaJrVW6Vww/bMku
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

# API docs at http://localhost:8080/api/swagger-ui/index.html (off in the prod profile).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
