# Production. Run with SPRING_PROFILES_ACTIVE=prod and provide these environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   FINOVEX_SECURITY_JWT_SECRET      base64, at least 32 random bytes
#   FINOVEX_CORS_ALLOWED_ORIGINS     e.g. https://app.example.com (only if the frontend is on another origin)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
